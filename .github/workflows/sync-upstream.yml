name: Sync upstream + Deploy

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/rmyndharis/OpenWA.git
          git fetch upstream main

      - name: Sync fork with upstream
        id: sync
        run: |
          git checkout main
          BEFORE=$(git rev-parse HEAD)
          git merge upstream/main --no-edit --allow-unrelated-histories
          AFTER=$(git rev-parse HEAD)
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"

      - name: Push to fork
        if: steps.sync.outputs.before != steps.sync.outputs.after
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.OPENWA_SYNC_PAT }}@github.com/RicardoRios07/OpenWA.git"
          git push origin main

      - name: Deploy to Coolify
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
            "https://159.195.17.158:8000/api/v1/deploy?uuid=n50tfqbjdl6d56vd2921c7bq&force=true"
