name: Sync fork with upstream

# Mantiene main actualizado sin desplegar directamente a producción.
# La rama stable solo avanza después de canary y promoción deliberada.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "openwa-sync[bot]"
          git config user.email "openwa-sync[bot]@users.noreply.github.com"

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/rmyndharis/OpenWA.git
          git fetch upstream main

      - name: Sync fork main
        id: sync
        run: |
          git checkout main
          BEFORE=$(git rev-parse HEAD)
          git merge upstream/main --ff-only
          AFTER=$(git rev-parse HEAD)
          echo "before=$BEFORE" >> "$GITHUB_OUTPUT"
          echo "after=$AFTER" >> "$GITHUB_OUTPUT"

      - name: Push to fork
        if: steps.sync.outputs.before != steps.sync.outputs.after
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.OPENWA_SYNC_PAT }}@github.com/RicardoRios07/OpenWA.git"
          git push origin main
